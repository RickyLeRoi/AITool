# tools.custom-example.yaml — CUSTOM/ADVANCED reference, not the default.
#
# The real, active "oracledb" MCP server does NOT use this file. It runs
# from tools.yaml, auto-generated by core/oracle_config_sync.py from the
# official Google template (tools/oracledb.template.yaml, vendored
# verbatim) plus your .env - see CLAUDE.md. That gives you the 7 built-in
# tools (list_tables, execute_sql, list_active_sessions, get_query_plan,
# list_top_sql_by_resource, list_tablespace_usage, list_invalid_objects)
# with zero hand-written YAML, and hot-reloads live when .env changes.
#
# Use THIS file as a starting point only if you need a CUSTOM query beyond
# those 7 - copy/merge it into tools.yaml by hand (or extend
# oracle_config_sync.py to append it automatically), since the sync script
# will otherwise overwrite tools.yaml with just the official template.
#
# Docs: https://mcp-toolbox.dev/integrations/oracle/

kind: source
name: oracle-db
type: oracle
# Pick ONE way to point at the database:
# 1) Full connection string:
connectionString: ${ORACLE_CONNECTION_STRING}
# 2) OR separate fields instead of connectionString:
# host: 127.0.0.1
# port: 1521
# serviceName: XEPDB1
user: ${ORACLE_USERNAME}
password: ${ORACLE_PASSWORD}
# useOCI: false  # true only if you need Oracle Wallet/Kerberos (needs Oracle Instant Client)

---
kind: tool
name: list-tables
type: oracle-sql
source: oracle-db
description: List all tables owned by the connected user.
statement: SELECT table_name FROM user_tables ORDER BY table_name

---
kind: tool
name: describe-table
type: oracle-sql
source: oracle-db
description: List columns, data types and nullability for one table.
parameters:
  - name: table_name
    type: string
    description: Name of the table to describe (Oracle identifiers are usually UPPERCASE).
# Oracle placeholders are positional/native style (:1, :2, ...), not $1/$2 like Postgres.
statement: |
  SELECT column_name, data_type, nullable
  FROM user_tab_columns
  WHERE table_name = :1
  ORDER BY column_id

---
# Tools default to read-only (SAFE mode) - add "readOnly: false" on a tool
# only if you deliberately need INSERT/UPDATE/DELETE, and think twice first.
kind: group
name: oracle-readonly
tools:
  - list-tables
  - describe-table
